<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>OLL UI Playground (debug harness)</title>
    </head>
    <body>
        <div id="app"></div>
        <pre id="pg-errors" style="color:#b91c1c; white-space:pre-wrap; font-size:11px; padding:8px;"></pre>
        <script>
            // DEBUG HARNESS: 捕获模块加载期错误，直接渲染到页面便于远程读取
            window.addEventListener("error", (e) => {
                document.getElementById("pg-errors").textContent +=
                    (e.error && e.error.stack) || e.message + "\n";
            });
            window.addEventListener("unhandledrejection", (e) => {
                document.getElementById("pg-errors").textContent +=
                    "REJECTION: " + ((e.reason && (e.reason.stack || e.reason.message)) || e.reason) + "\n";
            });
        </script>
        <script type="module" src="./main.ts"></script>
    </body>
</html>
